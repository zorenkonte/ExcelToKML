name: Android CI

# Auto-builds the app on every push to main, and on pull requests targeting main
# (so changes are validated before they are merged).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Material 3 Expressive rides the Compose 1.12 train, which requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK command-line tools and accepts the SDK licenses so
      # the Gradle build can auto-download the required platform (API 37) / build-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Provides Gradle dependency/build caching (the build itself runs via ./gradlew).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
